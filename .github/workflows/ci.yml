name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests and evals (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python tests/test_examples.py
      - name: Evals (zero invented concept, zero false link)
        run: |
          python evals/run.py
          python evals/run.py --json > evals-report.json
      - name: Keep the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ matrix.os }}-${{ matrix.python }}
          path: evals-report.json
          if-no-files-found: ignore
